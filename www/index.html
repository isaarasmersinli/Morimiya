<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height">
        <title>森宮中学校</title>
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="shortcut icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
        <style type="text/css">
            html, body {
                background-color: black;
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                user-select: none;
                -webkit-user-select: none;
                touch-action: manipulation;
            }
            canvas {
                image-rendering: pixelated;
            }

            /* --- SANAL KONTROL PANELLERİ --- */
            .touch-controls {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 9999;
                font-family: system-ui, -apple-system, sans-serif;
            }

            .v-btn {
                position: absolute;
                pointer-events: auto;
                background: rgba(255, 255, 255, 0.18);
                border: 2px solid rgba(255, 255, 255, 0.4);
                color: white;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
                font-size: 22px;
                backdrop-filter: blur(5px);
                -webkit-backdrop-filter: blur(5px);
                box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            }
            .v-btn:active {
                background: rgba(255, 255, 255, 0.5);
                transform: scale(0.92);
            }

            /* Yön Tuşları (D-Pad - Sol Alt) */
            .dpad-btn { border-radius: 12px; width: 48px; height: 48px; font-size: 18px; }
            #btn-up    { bottom: 105px; left: 60px;  }
            #btn-down  { bottom: 10px;  left: 60px;  }
            #btn-left  { bottom: 58px;  left: 12px;  }
            #btn-right { bottom: 58px;  left: 108px; }

            /* Aksiyon Tuşları (Sağ Alt) */
            #btn-shoot { bottom: 15px; right: 80px; width: 68px; height: 68px; background: rgba(230, 40, 40, 0.4); border-color: rgba(255, 120, 120, 0.6); font-size: 26px; } /* SPACE - Vurma (Ateş) */
            #btn-aim   { bottom: 85px; right: 20px; width: 60px; height: 60px; background: rgba(230, 160, 20, 0.4); border-color: rgba(255, 210, 100, 0.6); font-size: 24px; } /* E - Nişan */
            #btn-shift { bottom: 10px; right: 12px; width: 55px; height: 55px; background: rgba(40, 140, 240, 0.4); border-color: rgba(120, 190, 255, 0.6); font-size: 22px; } /* SHIFT - Koşma */

            /* Üst Panel (Durdurma & Silahlar) */
            #btn-esc   { top: 10px; right: 12px; width: 48px; height: 48px; border-radius: 12px; background: rgba(180, 40, 40, 0.5); font-size: 20px; } /* ESC - Pause */
            
            .weapon-bar {
                position: absolute;
                top: 10px;
                left: 10px;
                display: flex;
                gap: 8px;
                pointer-events: auto;
            }
            .w-btn {
                width: 42px;
                height: 42px;
                border-radius: 10px;
                font-size: 15px;
                background: rgba(0, 0, 0, 0.4);
            }
        </style>
    </head>
    <body>

        <!-- Dokunmatik Tuş Katmanı -->
        <div class="touch-controls">
            <!-- Silah Geçişleri (1, 2, 3, 4) -->
            <div class="weapon-bar">
                <div class="v-btn w-btn" onclick="sendKey(49, '1')">🔫1</div>
                <div class="v-btn w-btn" onclick="sendKey(50, '2')">🔫2</div>
                <div class="v-btn w-btn" onclick="sendKey(51, '3')">🔫3</div>
                <div class="v-btn w-btn" onclick="sendKey(52, '4')">🔫4</div>
            </div>

            <!-- ESC / Pause -->
            <div class="v-btn" id="btn-esc" onclick="sendKey(27, 'Escape')">⏸️</div>

            <!-- Yön Tuşları -->
            <div class="v-btn dpad-btn" id="btn-up" data-key="38" data-keyname="ArrowUp">▲</div>
            <div class="v-btn dpad-btn" id="btn-down" data-key="40" data-keyname="ArrowDown">▼</div>
            <div class="v-btn dpad-btn" id="btn-left" data-key="37" data-keyname="ArrowLeft">◄</div>
            <div class="v-btn dpad-btn" id="btn-right" data-key="39" data-keyname="ArrowRight">►</div>

            <!-- Aksiyon Sembolleri -->
            <div class="v-btn" id="btn-aim" data-key="69" data-keyname="KeyE">🎯</div>      <!-- E: Nişan Alma -->
            <div class="v-btn" id="btn-shoot" data-key="32" data-keyname="Space">💥</div>   <!-- SPACE: Vurma / Ateş -->
            <div class="v-btn" id="btn-shift" data-key="16" data-keyname="ShiftLeft">⚡</div> <!-- SHIFT: Koşma -->
        </div>

        <script type="text/javascript">
            // Mobil ses desteği
            window.addEventListener('DOMContentLoaded', function() {
                if (typeof Decrypter !== 'undefined') {
                    Decrypter._hasEncryptedAudio = true;
                }
            });

            // Sanal Tuş Basma Mekanizması
            function simulateKeyEvent(type, keyCode, key) {
                var event = new KeyboardEvent(type, {
                    keyCode: keyCode,
                    which: keyCode,
                    key: key,
                    bubbles: true,
                    cancelable: true
                });
                document.dispatchEvent(event);
            }

            // Tek Tık (Silahlar, Pause)
            function sendKey(keyCode, key) {
                simulateKeyEvent('keydown', keyCode, key);
                setTimeout(function() {
                    simulateKeyEvent('keyup', keyCode, key);
                }, 100);
            }

            // Basılı Tutmalı Tuşlar (Yönler, Nişan, Vurma, Koşma)
            document.querySelectorAll('.v-btn[data-key]').forEach(function(btn) {
                var keyCode = parseInt(btn.getAttribute('data-key'));
                var keyName = btn.getAttribute('data-keyname');

                var startPress = function(e) {
                    e.preventDefault();
                    simulateKeyEvent('keydown', keyCode, keyName);
                };

                var endPress = function(e) {
                    e.preventDefault();
                    simulateKeyEvent('keyup', keyCode, keyName);
                };

                btn.addEventListener('touchstart', startPress, {passive: false});
                btn.addEventListener('touchend', endPress, {passive: false});
                btn.addEventListener('mousedown', startPress);
                btn.addEventListener('mouseup', endPress);
            });
        </script>

        <script type="text/javascript" src="js/libs/pixi.js"></script>
        <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
        <script type="text/javascript" src="js/libs/pixi-picture.js"></script>
        <script type="text/javascript" src="js/libs/fpsmeter.js"></script>
        <script type="text/javascript" src="js/libs/lz-string.js"></script>
        <script type="text/javascript" src="js/libs/iphone-inline-video.browser.js"></script>
        <script type="text/javascript" src="js/rpg_core.js"></script>
        <script type="text/javascript" src="js/rpg_managers.js"></script>
        <script type="text/javascript" src="js/rpg_objects.js"></script>
        <script type="text/javascript" src="js/rpg_scenes.js"></script>
        <script type="text/javascript" src="js/rpg_sprites.js"></script>
        <script type="text/javascript" src="js/rpg_windows.js"></script>
        <script type="text/javascript" src="js/plugins.js"></script>
        <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>
