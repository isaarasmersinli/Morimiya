        <title>森宮中学校</title>

        <link rel="apple-touch-icon" href="icon/icon.png">

        <!-- TARAYICI ENJEKSİYON HATALARINI ENGELLEYEN KORUMA -->
        <script type="text/javascript">
            if (typeof window.__firefox__ === 'undefined') {
                window.__firefox__ = { reader: {} };
            }

            // Service Worker Kaydı (Çevrimdışı Çalışma İçin)
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js').catch((err) => {
                        console.log('SW hatası:', err);
                    });
                });
            }
        </script>

        <style type="text/css">
            html, body {
                background-color: black;
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                user-select: none;
                -webkit-user-select: none;
                touch-action: none;
            }
            
            /* --- TAM EKRAN CANVAS --- */
            #GameCanvas, canvas {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                margin: auto !important;
                width: 100vw !important;
                height: 100vh !important;
                object-fit: contain !important;
                image-rendering: pixelated;
                pointer-events: auto !important; /* Oyun alanına dokunabilmeyi sağladık */
            }

            /* --- DOKUNMATİK ARAYÜZ --- */
            .touch-controls {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 9999;
                font-family: monospace, monospace;
            }

            .credits-tag {
                position: absolute;
                bottom: 5px;
                left: 50%;
                transform: translateX(-50%);
                color: rgba(255, 255, 255, 0.3);
                font-size: 9px;
                letter-spacing: 0.5px;
                pointer-events: none;
            }

            .v-btn {
                position: absolute;
                pointer-events: auto;
                background: rgba(0, 0, 0, 0.6);
                border: 1px solid rgba(255, 255, 255, 0.5);
                color: #ffffff;
                border-radius: 4px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
                font-size: 15px;
                box-shadow: none;
                -webkit-tap-highlight-color: transparent;
            }
            .v-btn.active {
                background: rgba(255, 255, 255, 0.4);
                color: #000000;
            }
            .v-btn.toggle-on {
                background: rgba(50, 205, 50, 0.5) !important;
                border-color: #00ff00 !important;
                color: #ffffff !important;
            }

            /* Yön Tuşları (Sol Alt) */
            .dpad-btn { width: 46px; height: 46px; font-size: 15px; }
            #btn-up    { bottom: 104px; left: 56px;  }
            #btn-down  { bottom: 10px;   left: 56px;  }
            #btn-left  { bottom: 57px;   left: 10px;  }
            #btn-right { bottom: 57px;   left: 102px; }

            /* KOŞMA TUŞU (Yön tuşlarının sağ üstü) */
            #btn-shift { bottom: 120px; left: 115px; width: 44px; height: 44px; font-size: 14px; }

            /* Aksiyon Tuşları (Sağ Alt) */
            #btn-shoot { bottom: 15px; right: 85px; width: 62px; height: 62px; font-size: 20px; }
            #btn-aim   { bottom: 90px; right: 20px; width: 54px; height: 54px; font-size: 18px; }
            #btn-reload{ bottom: 90px; right: 85px; width: 54px; height: 54px; font-size: 15px; }

            /* OK (ENTER) TUŞU */
            #btn-interact { bottom: 160px; right: 20px; width: 75px; height: 45px; font-size: 13px; border-color: rgba(255, 255, 255, 0.8); background: rgba(30, 30, 30, 0.85); }

            /* Üst Panel: F2 (MENU) & ESC */
            #btn-f2       { top: 10px; right: 65px;  width: 55px; height: 40px; font-size: 11px; background: rgba(20, 20, 20, 0.8); }
            #btn-esc      { top: 10px; right: 10px;  width: 50px; height: 40px; font-size: 11px; }

            /* DİKEY SİLAH SEÇİM ÇUBUĞU (Sol Üst) */
            .weapon-bar-vertical {
                position: absolute;
                top: 10px;
                left: 10px;
                display: flex;
                flex-direction: column;
                gap: 4px;
                pointer-events: auto;
            }
            .w-btn {
                width: 34px;
                height: 32px;
                font-size: 12px;
                position: static !important;
            }
        </style>
    </head>
    <body>

        <div class="touch-controls">
            <!-- Dikey Silah Seçimi -->
            <div class="weapon-bar-vertical">
                <div class="v-btn w-btn" data-key="49" data-keyname="Digit1">[1]</div>
                <div class="v-btn w-btn" data-key="50" data-keyname="Digit2">[2]</div>
                <div class="v-btn w-btn" data-key="51" data-keyname="Digit3">[3]</div>
                <div class="v-btn w-btn" data-key="52" data-keyname="Digit4">[4]</div>
                <div class="v-btn w-btn" data-key="53" data-keyname="Digit5">[5]</div>
            </div>

            <!-- İmza -->
            <div class="credits-tag">mobile vers by @ptc6 ( Discord )</div>

            <!-- Sağ Üst Panel -->
            <div class="v-btn" id="btn-f2" data-key="113" data-keyname="F2">≡ MENU</div>
            <div class="v-btn" id="btn-esc" data-key="27" data-keyname="Escape">ESC</div>

            <div class="v-btn dpad-btn" id="btn-right" data-key="39" data-keyname="ArrowRight">►</div>

            <!-- Otomatik Koşma (Toggle Shift) -->
            <div class="v-btn" id="btn-shift" data-key="16" data-keyname="ShiftLeft">»</div>

            <!-- Aksiyon Tuşları ve OK Tuşu -->
            <div class="v-btn" id="btn-interact" data-key="13" data-keyname="Enter">⏎ OK</div>
            <div class="v-btn" id="btn-aim" data-key="69" data-keyname="KeyE">⊕</div>
            <div class="v-btn" id="btn-reload" data-key="82" data-keyname="KeyR">⟳</div>
            <div class="v-btn" id="btn-shoot" data-key="32" data-keyname="Space">⚔</div>
        </div>

        <script type="text/javascript">
            // --- SADECE OYUN ÇERÇEVESİNE (CANVAS) DOKUNMA YÖNETİMİ ---
            if (typeof TouchInput !== 'undefined') {
                var originalOnTrigger = TouchInput._onTrigger;
                TouchInput._onTrigger = function(x, y) {
                    var canvas = document.querySelector('canvas');
                    if (canvas) {
                        var rect = canvas.getBoundingClientRect();
                        // Eğer dokunma noktası ortadaki oyun ekranının (canvas) içindeyse çalıştır
                        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                            if (originalOnTrigger) originalOnTrigger.call(this, x, y);
                            return;
                        }
                    }
                    // Siyah alanlara veya butonlara basıldıysa yürümeyi engelle
                };
            }

            // --- KESİNTİSİZ SES SÜRÜCÜSÜ KİLİT AÇICI ---
            function unlockAudioEngine() {
                if (typeof WebAudio !== 'undefined' && WebAudio._context) {
                    if (WebAudio._context.state === 'suspended' || WebAudio._context.state === 'interrupted') {
                        WebAudio._context.resume();
                    }
                }
            }

            function setKeyState(keyCode, keyName, isPressed) {
                unlockAudioEngine();

                var eventType = isPressed ? 'keydown' : 'keyup';
                var event = new KeyboardEvent(eventType, {
                    keyCode: keyCode,
                    which: keyCode,
                    key: keyName,
                    code: keyName,
                    bubbles: true,
                    cancelable: true
                });
                document.dispatchEvent(event);

                if (typeof Input !== 'undefined' && Input._currentState) {
                    var mapper = Input.keyMapper[keyCode];
                    if (mapper) {
                        Input._currentState[mapper] = isPressed;
                    }
                }
            }

            // --- GELİŞMİŞ ÇOKLU DOKUNMA VE SÜRÜKLEME TESPİTİ ---
            var isAutoRunning = false;

            function processTouch(touch) {
                var elem = document.elementFromPoint(touch.clientX, touch.clientY);
                if (elem && elem.classList.contains('v-btn')) {
                    return elem;
                }
                return null;
            }

            function updateTouches(e) {
                e.preventDefault();
                unlockAudioEngine();

                var currentPressedButtons = {};

                for (var i = 0; i < e.touches.length; i++) {
                    var touch = e.touches[i];
                    var btn = processTouch(touch);
                    if (btn) {
                        currentPressedButtons[btn.id || btn.getAttribute('data-key')] = btn;
                    }
                }

                var buttons = document.querySelectorAll('.v-btn');
                buttons.forEach(function(btn) {
                    var btnId = btn.id || btn.getAttribute('data-key');
                    var keyCode = parseInt(btn.getAttribute('data-key'));
                    var keyName = btn.getAttribute('data-keyname');

                    if (btn.id === 'btn-shift') return;

                    if (currentPressedButtons[btnId]) {
                        if (!btn.classList.contains('active')) {
                            btn.classList.add('active');
                            if (keyCode) setKeyState(keyCode, keyName, true);
                        }
                    } else {
                        if (btn.classList.contains('active')) {
                            btn.classList.remove('active');
                            if (keyCode) setKeyState(keyCode, keyName, false);
                        }
                    }
                });
            }

            window.addEventListener('touchstart', function(e) {
                for (var i = 0; i < e.changedTouches.length; i++) {
                    var touch = e.changedTouches[i];
                    var btn = processTouch(touch);
                    if (btn && btn.id === 'btn-shift') {
                        isAutoRunning = !isAutoRunning;
                        setKeyState(16, 'ShiftLeft', isAutoRunning);
                        if (isAutoRunning) {
                            btn.classList.add('toggle-on');
                        } else {
                            btn.classList.remove('toggle-on');
                        }
                    }
                }
                updateTouches(e);
            }, {passive: false});

            window.addEventListener('touchmove', updateTouches, {passive: false});
            window.addEventListener('touchend', updateTouches, {passive: false});
            window.addEventListener('touchcancel', updateTouches, {passive: false});

            window.addEventListener('click', unlockAudioEngine);
            window.addEventListener('touchstart', unlockAudioEngine);
        </script>

        <script type="text/javascript" src="js/main.js"></script>
    </body>
