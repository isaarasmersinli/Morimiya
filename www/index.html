<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height">
        <title>森宮中学校</title>
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="shortcut icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
        <style type="text/css">
            html, body {
                background-color: black;
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                user-select: none;
                -webkit-user-select: none;
                touch-action: manipulation;
            }
            canvas {
                image-rendering: pixelated;
            }

            /* --- MİNİMALİST MONOKROM ARAYÜZ --- */
            .touch-controls {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 9999;
                font-family: monospace, monospace;
            }

            .credits-tag {
                position: absolute;
                top: 55px;
                left: 12px;
                color: rgba(255, 255, 255, 0.4);
                font-size: 10px;
                letter-spacing: 0.5px;
                pointer-events: none;
            }

            .v-btn {
                position: absolute;
                pointer-events: auto;
                background: rgba(0, 0, 0, 0.5);
                border: 1px solid rgba(255, 255, 255, 0.4);
                color: #ffffff;
                border-radius: 4px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
                font-size: 16px;
                box-shadow: none;
            }
            .v-btn:active {
                background: rgba(255, 255, 255, 0.3);
                color: #000000;
            }

            /* Yön Tuşları */
            .dpad-btn { width: 44px; height: 44px; font-size: 14px; }
            #btn-up    { bottom: 100px; left: 56px;  }
            #btn-down  { bottom: 10px;  left: 56px;  }
            #btn-left  { bottom: 55px;  left: 10px;  }
            #btn-right { bottom: 55px;  left: 102px; }

            /* Aksiyon Tuşları */
            #btn-shoot { bottom: 15px; right: 80px; width: 60px; height: 60px; font-size: 20px; } /* SPACE - Vurma */
            #btn-aim   { bottom: 85px; right: 20px; width: 52px; height: 52px; font-size: 18px; } /* E - Nişan */
            #btn-reload{ bottom: 85px; right: 80px; width: 52px; height: 52px; font-size: 15px; } /* R - Reload */
            #btn-shift { bottom: 15px; right: 15px; width: 52px; height: 52px; font-size: 14px; } /* SHIFT - Koşma */

            /* Üst Panel */
            #btn-esc   { top: 10px; right: 10px; width: 44px; height: 38px; font-size: 12px; }
            
            .weapon-bar {
                position: absolute;
                top: 10px;
                left: 10px;
                display: flex;
                gap: 6px;
                pointer-events: auto;
            }
            .w-btn {
                width: 38px;
                height: 38px;
                font-size: 13px;
            }
        </style>
    </head>
    <body>

        <div class="touch-controls">
            <!-- Silah Seçimi (1, 2, 3, 4) -->
            <div class="weapon-bar">
                <div class="v-btn w-btn" data-key="49" data-keyname="Digit1">[1]</div>
                <div class="v-btn w-btn" data-key="50" data-keyname="Digit2">[2]</div>
                <div class="v-btn w-btn" data-key="51" data-keyname="Digit3">[3]</div>
                <div class="v-btn w-btn" data-key="52" data-keyname="Digit4">[4]</div>
            </div>

            <!-- İmzamız -->
            <div class="credits-tag">mobile vers by @ptc6 ( Discord )</div>

            <!-- ESC / Pause -->
            <div class="v-btn" id="btn-esc" data-key="27" data-keyname="Escape">ESC</div>

            <!-- Yön Tuşları -->
            <div class="v-btn dpad-btn" id="btn-up" data-key="38" data-keyname="ArrowUp">▲</div>
            <div class="v-btn dpad-btn" id="btn-down" data-key="40" data-keyname="ArrowDown">▼</div>
            <div class="v-btn dpad-btn" id="btn-left" data-key="37" data-keyname="ArrowLeft">◄</div>
            <div class="v-btn dpad-btn" id="btn-right" data-key="39" data-keyname="ArrowRight">►</div>

            <!-- Aksiyon Sembolleri -->
            <div class="v-btn" id="btn-aim" data-key="69" data-keyname="KeyE">⊕</div>     <!-- E: Nişan -->
            <div class="v-btn" id="btn-reload" data-key="82" data-keyname="KeyR">⟳</div>  <!-- R: Reload -->
            <div class="v-btn" id="btn-shoot" data-key="32" data-keyname="Space">⚔</div>  <!-- SPACE: Ateş -->
            <div class="v-btn" id="btn-shift" data-key="16" data-keyname="ShiftLeft">»</div> <!-- SHIFT: Koşma -->
        </div>

        <script type="text/javascript">
            // 1. Web Audio Kilit Açıcı ve Decrypter Düzeltmesi
            window.addEventListener('DOMContentLoaded', function() {
                if (typeof Decrypter !== 'undefined') {
                    Decrypter._hasEncryptedAudio = true;
                }
            });

            // İlk dokunuşta tarayıcı ses motorunu uyandır
            function unlockAudio() {
                if (typeof WebAudio !== 'undefined' && WebAudio._context && WebAudio._context.state === 'suspended') {
                    WebAudio._context.resume();
                }
            }
            window.addEventListener('touchstart', unlockAudio, { once: true });
            window.addEventListener('click', unlockAudio, { once: true });

            // 2. Güvenli Tuş Tetikleme Mekanizması
            function triggerKeyEvent(type, keyCode, keyName) {
                unlockAudio(); // Her tuşta ses durumunu garantiye al

                // DOM Klavye Olayı
                var event = new KeyboardEvent(type, {
                    keyCode: keyCode,
                    which: keyCode,
                    key: keyName,
                    code: keyName,
                    bubbles: true,
                    cancelable: true
                });
                document.dispatchEvent(event);

                // RPG Maker MV Input Eşleşmesi
                if (typeof Input !== 'undefined' && Input._currentState) {
                    var mapper = Input.keyMapper[keyCode];
                    if (mapper) {
                        Input._currentState[mapper] = (type === 'keydown');
                    }
                }
            }

            // Tuş Yönetimi
            document.querySelectorAll('.v-btn[data-key]').forEach(function(btn) {
                var keyCode = parseInt(btn.getAttribute('data-key'));
                var keyName = btn.getAttribute('data-keyname');

                var startPress = function(e) {
                    if (e.cancelable) e.preventDefault();
                    triggerKeyEvent('keydown', keyCode, keyName);
                };

                var endPress = function(e) {
                    if (e.cancelable) e.preventDefault();
                    triggerKeyEvent('keyup', keyCode, keyName);
                };

                btn.addEventListener('touchstart', startPress, {passive: false});
                btn.addEventListener('touchend', endPress, {passive: false});
                btn.addEventListener('mousedown', startPress);
                btn.addEventListener('mouseup', endPress);
            });
        </script>

        <script type="text/javascript" src="js/libs/pixi.js"></script>
        <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
        <script type="text/javascript" src="js/libs/pixi-picture.js"></script>
        <script type="text/javascript" src="js/libs/fpsmeter.js"></script>
        <script type="text/javascript" src="js/libs/lz-string.js"></script>
        <script type="text/javascript" src="js/libs/iphone-inline-video.browser.js"></script>
        <script type="text/javascript" src="js/rpg_core.js"></script>
        <script type="text/javascript" src="js/rpg_managers.js"></script>
        <script type="text/javascript" src="js/rpg_objects.js"></script>
        <script type="text/javascript" src="js/rpg_scenes.js"></script>
        <script type="text/javascript" src="js/rpg_sprites.js"></script>
        <script type="text/javascript" src="js/rpg_windows.js"></script>
        <script type="text/javascript" src="js/plugins.js"></script>
        <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>
