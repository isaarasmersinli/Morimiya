<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="Morimiya">
        <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height">
        <title>森宮中学校</title>
        
        <link rel="manifest" href="manifest.json">
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="shortcut icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
        
        <script type="text/javascript">
            if (typeof window.__firefox__ === 'undefined') {
                window.__firefox__ = { reader: {} };
            }

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js').catch((err) => {
                        console.log('SW hatası:', err);
                    });
                });
            }
        </script>

        <style type="text/css">
            html, body {
                background-color: #8b1a2b !important;
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                user-select: none;
                -webkit-user-select: none;
                touch-action: none;
            }
            
            #GameCanvas, canvas {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                margin: auto !important;
                width: 100vw !important;
                height: 100vh !important;
                object-fit: contain !important;
                image-rendering: pixelated;
                pointer-events: none !important;
            }

            .touch-controls {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 9999;
                font-family: sans-serif;
            }

            .v-btn {
                position: absolute;
                pointer-events: auto;
                background: rgba(255, 255, 255, 0.08) !important;
                border: 2px solid rgba(255, 255, 255, 0.4) !important;
                color: rgba(255, 255, 255, 0.7) !important;
                border-radius: 50% !important;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
                font-size: 15px;
                box-shadow: none;
                -webkit-tap-highlight-color: transparent;
                box-sizing: border-box;
                backdrop-filter: blur(2px);
            }

            .v-btn.active {
                background: rgba(255, 255, 255, 0.25) !important;
                color: #ffffff !important;
            }

            /* Sol Üstteki Ok Tuşları (Silah Değiştirme) */
            .dpad-btn { 
                width: 48px; 
                height: 48px; 
                font-size: 18px;
                border: none !important;
                background: transparent !important;
                color: rgba(255, 255, 255, 0.6) !important;
            }
            #btn-up    { top: 10px;  left: 56px;  }
            #btn-down  { top: 104px; left: 56px;  }
            #btn-left  { top: 57px;  left: 10px;  }  /* Geri */
            #btn-right { top: 57px;  left: 102px; } /* İleri */

            /* Sol Taraf Alt Butonlar */
            #btn-l       { bottom: 105px; left: 160px; width: 55px; height: 55px; }
            #btn-lt      { bottom: 40px;  left: 160px; width: 55px; height: 55px; }
            #btn-rt-left { bottom: 40px;  left: 225px; width: 55px; height: 55px; }

            /* Sağ Taraf Dairesel Butonlar */
            #btn-rt-right{ bottom: 110px; right: 110px; width: 75px; height: 75px; font-size: 18px; }
            #btn-r       { bottom: 180px; right: 80px;  width: 55px; height: 55px; }
            #btn-b       { bottom: 110px; right: 25px;  width: 55px; height: 55px; }
            #btn-a       { bottom: 45px;  right: 80px;  width: 55px; height: 55px; }
            #btn-y       { bottom: 10px;  right: 15px;  width: 55px; height: 55px; }

            /* Gizlenen Üst Paneller */
            #btn-edit, #edit-panel {
                display: none !important;
            }
        </style>
    </head>
    <body>

        <div class="touch-controls" id="touch-controls">
            <!-- Sol Üst Yön Okları -->
            <div class="v-btn dpad-btn" id="btn-up">▲</div>
            <div class="v-btn dpad-btn" id="btn-down">▼</div>
            <div class="v-btn dpad-btn" id="btn-left">◄</div>
            <div class="v-btn dpad-btn" id="btn-right">►</div>

            <!-- Sol Alt Dairesel Butonlar -->
            <div class="v-btn" id="btn-l">L</div>
            <div class="v-btn" id="btn-lt">LT</div>
            <div class="v-btn" id="btn-rt-left">RT</div>

            <!-- Sağ Taraf Dairesel Butonlar -->
            <div class="v-btn" id="btn-rt-right">RT</div>
            <div class="v-btn" id="btn-r">R</div>
            <div class="v-btn" id="btn-b" data-key="27" data-keyname="Escape">B</div>
            <div class="v-btn" id="btn-a" data-key="13" data-keyname="Enter">A</div>
            <div class="v-btn" id="btn-y" data-key="32" data-keyname="Space">Y</div>
        </div>

        <script type="text/javascript" src="js/libs/pixi.js"></script>
        <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
        <script type="text/javascript" src="js/libs/pixi-picture.js"></script>
        <script type="text/javascript" src="js/libs/fpsmeter.js"></script>
        <script type="text/javascript" src="js/libs/lz-string.js"></script>
        <script type="text/javascript" src="js/libs/iphone-inline-video.browser.js"></script>
        <script type="text/javascript" src="js/rpg_core.js"></script>
        <script type="text/javascript" src="js/rpg_managers.js"></script>
        <script type="text/javascript" src="js/rpg_objects.js"></script>
        <script type="text/javascript" src="js/rpg_scenes.js"></script>
        <script type="text/javascript" src="js/rpg_sprites.js"></script>
        <script type="text/javascript" src="js/rpg_windows.js"></script>
        <script type="text/javascript" src="js/plugins.js"></script>

        <script type="text/javascript">
            if (typeof TouchInput !== 'undefined') {
                TouchInput._onTrigger = function() {};
                TouchInput._onMouseDown = function() {};
                TouchInput._onPointerDown = function() {};
                TouchInput._onMouseMove = function() {};
                TouchInput._onTouchStart = function() {};
                TouchInput._onTouchMove = function() {};
                TouchInput.update = function() {};
            }

            function unlockAudioEngine() {
                if (typeof WebAudio !== 'undefined' && WebAudio._context) {
                    if (WebAudio._context.state === 'suspended' || WebAudio._context.state === 'interrupted') {
                        WebAudio._context.resume();
                    }
                }
            }

            function setKeyState(keyCode, keyName, isPressed) {
                unlockAudioEngine();

                var eventType = isPressed ? 'keydown' : 'keyup';
                var event = new KeyboardEvent(eventType, {
                    keyCode: keyCode,
                    which: keyCode,
                    key: keyName,
                    code: keyName,
                    bubbles: true,
                    cancelable: true
                });
                document.dispatchEvent(event);

                if (typeof Input !== 'undefined' && Input._currentState) {
                    var mapper = Input.keyMapper[keyCode];
                    if (mapper) {
                        Input._currentState[mapper] = isPressed;
                    }
                }
            }

            // --- SAĞ / SOL OK İLE 1-5 ARASI SİLAH SEÇME ---
            var currentWeapon = 1;

            function cycleWeapon(direction) {
                if (direction === 'next') { // Sağ Ok
                    currentWeapon++;
                    if (currentWeapon > 5) currentWeapon = 1;
                } else if (direction === 'prev') { // Sol Ok
                    currentWeapon--;
                    if (currentWeapon < 1) currentWeapon = 5;
                }
                
                var keyCode = 48 + currentWeapon; // 49 = '1', 50 = '2', ..., 53 = '5'
                var keyName = 'Digit' + currentWeapon;

                setKeyState(keyCode, keyName, true);
                setTimeout(function() {
                    setKeyState(keyCode, keyName, false);
                }, 100);
            }

            function processTouch(touch) {
                var elem = document.elementFromPoint(touch.clientX, touch.clientY);
                if (elem && elem.classList.contains('v-btn')) {
                    return elem;
                }
                return null;
            }

            window.addEventListener('touchstart', function(e) {
                e.preventDefault();
                unlockAudioEngine();

                for (var i = 0; i < e.changedTouches.length; i++) {
                    var touch = e.changedTouches[i];
                    var btn = processTouch(touch);
                    
                    if (btn) {
                        btn.classList.add('active');

                        if (btn.id === 'btn-right') {
                            cycleWeapon('next'); // Sağ Ok: İleri
                        } else if (btn.id === 'btn-left') {
                            cycleWeapon('prev'); // Sol Ok: Geri
                        } else {
                            var keyCode = parseInt(btn.getAttribute('data-key'));
                            var keyName = btn.getAttribute('data-keyname');
                            if (keyCode) setKeyState(keyCode, keyName, true);
                        }
                    }
                }
            }, {passive: false});

            window.addEventListener('touchend', function(e) {
                e.preventDefault();
                for (var i = 0; i < e.changedTouches.length; i++) {
                    var touch = e.changedTouches[i];
                    var btn = processTouch(touch);
                    if (btn) {
                        btn.classList.remove('active');
                        var keyCode = parseInt(btn.getAttribute('data-key'));
                        var keyName = btn.getAttribute('data-keyname');
                        if (keyCode) setKeyState(keyCode, keyName, false);
                    }
                }
            }, {passive: false});

            window.addEventListener('click', unlockAudioEngine);
        </script>

        <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>
