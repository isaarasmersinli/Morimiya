<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="Morimiya">
        <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height">
        <title>森宮中学校</title>
        
        <link rel="manifest" href="manifest.json">
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="shortcut icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
        
        <script type="text/javascript">
            if (typeof window.__firefox__ === 'undefined') {
                window.__firefox__ = { reader: {} };
            }

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js').catch((err) => {
                        console.log('SW hatası:', err);
                    });
                });
            }
        </script>

        <style type="text/css">
            html, body {
                background-color: #000000 !important;
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                user-select: none;
                -webkit-user-select: none;
                touch-action: none;
            }
            
            #GameCanvas, canvas {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                margin: auto !important;
                width: 100vw !important;
                height: 100vh !important;
                object-fit: contain !important;
                image-rendering: pixelated;
                pointer-events: none !important;
            }

            .touch-controls {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 9999;
                font-family: Arial, sans-serif;
            }

            /* Genel Şeffaf Halka Buton Tasarımı */
            .v-btn {
                position: absolute;
                pointer-events: auto;
                background: rgba(255, 255, 255, 0.05) !important;
                border: 1.5px solid rgba(255, 255, 255, 0.5) !important;
                color: rgba(255, 255, 255, 0.9) !important;
                border-radius: 50% !important;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
                font-size: 15px;
                box-shadow: none;
                -webkit-tap-highlight-color: transparent;
                box-sizing: border-box;
            }

            .v-btn.active {
                background: rgba(255, 255, 255, 0.3) !important;
                border-color: #ffffff !important;
                color: #ffffff !important;
            }

            /* VURMA/ATEŞ TUŞU (Koyu Kırmızı ve Hafif Şeffaf) */
            #btn-attack {
                bottom: 110px;
                right: 110px;
                width: 72px;
                height: 72px;
                font-size: 16px;
                background: rgba(139, 0, 0, 0.4) !important; /* Koyu kırmızı şeffaf */
                border: 2px solid rgba(255, 75, 75, 0.7) !important;
                color: #ffffff !important;
            }

            #btn-attack.active {
                background: rgba(200, 0, 0, 0.7) !important;
                border-color: #ffffff !important;
            }

            /* HAREKET TUŞLARI (SOL ALT D-PAD) */
            .move-btn {
                width: 52px;
                height: 52px;
                font-size: 20px;
            }
            #btn-move-up    { bottom: 114px; left: 62px;  }
            #btn-move-down  { bottom: 10px;  left: 62px;  }
            #btn-move-left  { bottom: 62px;  left: 10px;  }
            #btn-move-right { bottom: 62px;  left: 114px; }

            /* SOL ÜST SİLAH DEĞİŞTİRME OKLARI */
            .weapon-switch-btn {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
            #btn-weapon-prev { top: 60px; left: 15px; }
            #btn-weapon-next { top: 60px; left: 68px; }

            /* SOL ALT KOŞMA (SHIFT) VE DİĞER EK TUŞLAR */
            #btn-shift   { bottom: 110px; left: 180px; width: 52px; height: 52px; font-size: 11px; }
            #btn-lt      { bottom: 50px;  left: 180px; width: 50px; height: 50px; }
            #btn-rt-left { bottom: 50px;  left: 238px; width: 50px; height: 50px; }

            /* SAĞ TARAF AKSİYON TUŞLARI */
            #btn-r       { bottom: 180px; right: 80px;  width: 52px; height: 52px; }
            #btn-b       { bottom: 110px; right: 25px;  width: 52px; height: 52px; }
            #btn-a       { bottom: 45px;  right: 80px;  width: 52px; height: 52px; }
            #btn-y       { bottom: 10px;  right: 15px;  width: 52px; height: 52px; }

            #btn-edit, #edit-panel {
                display: none !important;
            }
        </style>
    </head>
    <body>

        <div class="touch-controls" id="touch-controls">
            <!-- Sol Üst: Silah Değiştirme Okları -->
            <div class="v-btn weapon-switch-btn" id="btn-weapon-prev">◄</div>
            <div class="v-btn weapon-switch-btn" id="btn-weapon-next">►</div>

            <!-- Sol Alt: Karakter Hareket Tuşları (D-Pad) -->
            <div class="v-btn move-btn" id="btn-move-up" data-key="38" data-keyname="ArrowUp">▲</div>
            <div class="v-btn move-btn" id="btn-move-down" data-key="40" data-keyname="ArrowDown">▼</div>
            <div class="v-btn move-btn" id="btn-move-left" data-key="37" data-keyname="ArrowLeft">◄</div>
            <div class="v-btn move-btn" id="btn-move-right" data-key="39" data-keyname="ArrowRight">►</div>

            <!-- Sol Yan: SHIFT (Koşma) ve Ek Tuşlar -->
            <div class="v-btn" id="btn-shift" data-key="16" data-keyname="ShiftLeft">SHIFT</div>
            <div class="v-btn" id="btn-lt" data-key="17" data-keyname="ControlLeft">CTRL</div>
            <div class="v-btn" id="btn-rt-left" data-key="18" data-keyname="AltLeft">ALT</div>

            <!-- Sağ Taraf: Vurma Tuşu ve Aksiyon Tuşları -->
            <div class="v-btn" id="btn-attack" data-key="32" data-keyname="Space">VUR</div>
            <div class="v-btn" id="btn-r" data-key="82" data-keyname="KeyR">R</div>
            <div class="v-btn" id="btn-b" data-key="27" data-keyname="Escape">B</div>
            <div class="v-btn" id="btn-a" data-key="13" data-keyname="Enter">A</div>
            <div class="v-btn" id="btn-y" data-key="69" data-keyname="KeyE">Y</div>
        </div>

        <script type="text/javascript" src="js/libs/pixi.js"></script>
        <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
        <script type="text/javascript" src="js/libs/pixi-picture.js"></script>
        <script type="text/javascript" src="js/libs/fpsmeter.js"></script>
        <script type="text/javascript" src="js/libs/lz-string.js"></script>
        <script type="text/javascript" src="js/libs/iphone-inline-video.browser.js"></script>
        <script type="text/javascript" src="js/rpg_core.js"></script>
        <script type="text/javascript" src="js/rpg_managers.js"></script>
        <script type="text/javascript" src="js/rpg_objects.js"></script>
        <script type="text/javascript" src="js/rpg_scenes.js"></script>
        <script type="text/javascript" src="js/rpg_sprites.js"></script>
        <script type="text/javascript" src="js/rpg_windows.js"></script>
        <script type="text/javascript" src="js/plugins.js"></script>

        <script type="text/javascript">
            if (typeof TouchInput !== 'undefined') {
                TouchInput._onTrigger = function() {};
                TouchInput._onMouseDown = function() {};
                TouchInput._onPointerDown = function() {};
                TouchInput._onMouseMove = function() {};
                TouchInput._onTouchStart = function() {};
                TouchInput._onTouchMove = function() {};
                TouchInput.update = function() {};
            }

            function unlockAudioEngine() {
                if (typeof WebAudio !== 'undefined' && WebAudio._context) {
                    if (WebAudio._context.state === 'suspended' || WebAudio._context.state === 'interrupted') {
                        WebAudio._context.resume();
                    }
                }
            }

            function setKeyState(keyCode, keyName, isPressed) {
                unlockAudioEngine();

                var eventType = isPressed ? 'keydown' : 'keyup';
                var event = new KeyboardEvent(eventType, {
                    keyCode: keyCode,
                    which: keyCode,
                    key: keyName,
                    code: keyName,
                    bubbles: true,
                    cancelable: true
                });
                document.dispatchEvent(event);

                if (typeof Input !== 'undefined' && Input._currentState) {
                    var mapper = Input.keyMapper[keyCode];
                    if (mapper) {
                        Input._currentState[mapper] = isPressed;
                    }
                }
            }

            // --- Silah Değiştirme Mantığı ---
            var currentWeapon = 1;

            function cycleWeapon(direction) {
                if (direction === 'next') {
                    currentWeapon++;
                    if (currentWeapon > 5) currentWeapon = 1;
                } else if (direction === 'prev') {
                    currentWeapon--;
                    if (currentWeapon < 1) currentWeapon = 5;
                }
                
                var keyCode = 48 + currentWeapon;
                var keyName = 'Digit' + currentWeapon;

                setKeyState(keyCode, keyName, true);
                setTimeout(function() {
                    setKeyState(keyCode, keyName, false);
                }, 100);
            }

            // --- Kesin Dokunma ve Sürükleme (Touch Tracking) Mantığı ---
            var activeTouches = {};

            function getButtonFromPoint(x, y) {
                var elem = document.elementFromPoint(x, y);
                if (elem && elem.classList.contains('v-btn')) {
                    return elem;
                }
                return null;
            }

            function pressButton(btn) {
                if (!btn || btn.classList.contains('active')) return;
                btn.classList.add('active');

                if (btn.id === 'btn-weapon-next') {
                    cycleWeapon('next');
                } else if (btn.id === 'btn-weapon-prev') {
                    cycleWeapon('prev');
                } else {
                    var keyCode = parseInt(btn.getAttribute('data-key'));
                    var keyName = btn.getAttribute('data-keyname');
                    if (keyCode) setKeyState(keyCode, keyName, true);
                }
            }

            function releaseButton(btn) {
                if (!btn || !btn.classList.contains('active')) return;
                btn.classList.remove('active');

                var keyCode = parseInt(btn.getAttribute('data-key'));
                var keyName = btn.getAttribute('data-keyname');
                if (keyCode) setKeyState(keyCode, keyName, false);
            }

            function handleTouch(e) {
                e.preventDefault();
                unlockAudioEngine();

                var currentTouchMap = {};

                for (var i = 0; i < e.touches.length; i++) {
                    var touch = e.touches[i];
                    var id = touch.identifier;
                    var btn = getButtonFromPoint(touch.clientX, touch.clientY);

                    currentTouchMap[id] = btn;

                    // Eğer parmak farklı bir butonun üstüne kaydıysa
                    if (activeTouches[id] !== btn) {
                        if (activeTouches[id]) {
                            releaseButton(activeTouches[id]);
                        }
                        if (btn) {
                            pressButton(btn);
                        }
                        activeTouches[id] = btn;
                    }
                }

                // Parmağını ekrandan kaldıranları temizle
                for (var id in activeTouches) {
                    if (!currentTouchMap[id]) {
                        if (activeTouches[id]) {
                            releaseButton(activeTouches[id]);
                        }
                        delete activeTouches[id];
                    }
                }
            }

            window.addEventListener('touchstart', handleTouch, {passive: false});
            window.addEventListener('touchmove', handleTouch, {passive: false});
            window.addEventListener('touchend', handleTouch, {passive: false});
            window.addEventListener('touchcancel', handleTouch, {passive: false});

            window.addEventListener('click', unlockAudioEngine);
        </script>

        <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>
