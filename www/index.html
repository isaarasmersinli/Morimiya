<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height">
        <title>森宮中学校</title>
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="shortcut icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
        <style type="text/css">
            html, body {
                background-color: black;
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                user-select: none;
                -webkit-user-select: none;
                touch-action: none;
            }
            
            /* --- KANVAS BOYUTUNU EKRANA YAYMA (TAM EKRAN) --- */
            #GameCanvas, canvas {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                margin: auto !important;
                width: 100vw !important;
                height: 100vh !important;
                object-fit: contain !important;
                image-rendering: pixelated;
            }

            /* --- MONOKROM DOKUNMATİK ARAYÜZ --- */
            .touch-controls {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 9999;
                font-family: monospace, monospace;
            }

            .credits-tag {
                position: absolute;
                top: 55px;
                left: 12px;
                color: rgba(255, 255, 255, 0.4);
                font-size: 10px;
                letter-spacing: 0.5px;
                pointer-events: none;
            }

            .v-btn {
                position: absolute;
                pointer-events: auto;
                background: rgba(0, 0, 0, 0.6);
                border: 1px solid rgba(255, 255, 255, 0.5);
                color: #ffffff;
                border-radius: 4px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
                font-size: 15px;
                box-shadow: none;
            }
            .v-btn.active {
                background: rgba(255, 255, 255, 0.4);
                color: #000000;
            }

            /* Yön Tuşları */
            .dpad-btn { width: 48px; height: 48px; font-size: 15px; }
            #btn-up    { bottom: 108px; left: 58px;  }
            #btn-down  { bottom: 10px;   left: 58px;  }
            #btn-left  { bottom: 59px;   left: 10px;  }
            #btn-right { bottom: 59px;   left: 106px; }

            /* Aksiyon Tuşları (Sağ Alt) */
            #btn-shoot { bottom: 15px; right: 85px; width: 62px; height: 62px; font-size: 20px; } /* SPACE */
            #btn-aim   { bottom: 90px; right: 20px; width: 54px; height: 54px; font-size: 18px; } /* E */
            #btn-reload{ bottom: 90px; right: 85px; width: 54px; height: 54px; font-size: 15px; } /* R */
            #btn-shift { bottom: 15px; right: 15px; width: 54px; height: 54px; font-size: 14px; } /* SHIFT */

            /* Üst Panel: ETKİLEŞİM & ESC */
            #btn-interact { top: 10px; right: 65px; width: 95px; height: 42px; font-size: 13px; border-color: rgba(255, 255, 255, 0.8); background: rgba(30, 30, 30, 0.8); }
            #btn-esc      { top: 10px; right: 10px; width: 48px; height: 42px; font-size: 12px; }

            /* Silah Seçim Çubuğu (1, 2, 3, 4, 5) */
            .weapon-bar {
                position: absolute;
                top: 10px;
                left: 10px;
                display: flex;
                gap: 5px;
                pointer-events: auto;
            }
            .w-btn {
                width: 38px;
                height: 38px;
                font-size: 13px;
            }
        </style>
    </head>
    <body>

        <div class="touch-controls">
            <!-- Silah Seçimi (1, 2, 3, 4, 5) -->
            <div class="weapon-bar">
                <div class="v-btn w-btn" data-key="49" data-keyname="Digit1">[1]</div>
                <div class="v-btn w-btn" data-key="50" data-keyname="Digit2">[2]</div>
                <div class="v-btn w-btn" data-key="51" data-keyname="Digit3">[3]</div>
                <div class="v-btn w-btn" data-key="52" data-keyname="Digit4">[4]</div>
                <div class="v-btn w-btn" data-key="53" data-keyname="Digit5">[5]</div>
            </div>

            <!-- İmza -->
            <div class="credits-tag">mobile vers by @ptc6 ( Discord )</div>

            <!-- Sağ Üst Panel -->
            <div class="v-btn" id="btn-interact" data-key="13" data-keyname="Enter">⏎ OK</div>
            <div class="v-btn" id="btn-esc" data-key="27" data-keyname="Escape">ESC</div>

            <!-- Yön Tuşları -->
            <div class="v-btn dpad-btn" id="btn-up" data-key="38" data-keyname="ArrowUp">▲</div>
            <div class="v-btn dpad-btn" id="btn-down" data-key="40" data-keyname="ArrowDown">▼</div>
            <div class="v-btn dpad-btn" id="btn-left" data-key="37" data-keyname="ArrowLeft">◄</div>
            <div class="v-btn dpad-btn" id="btn-right" data-key="39" data-keyname="ArrowRight">►</div>

            <!-- Aksiyon Tuşları -->
            <div class="v-btn" id="btn-aim" data-key="69" data-keyname="KeyE">⊕</div>
            <div class="v-btn" id="btn-reload" data-key="82" data-keyname="KeyR">⟳</div>
            <div class="v-btn" id="btn-shoot" data-key="32" data-keyname="Space">⚔</div>
            <div class="v-btn" id="btn-shift" data-key="16" data-keyname="ShiftLeft">»</div>
        </div>

        <!-- RPG Maker Temel Kütüphaneleri -->
        <script type="text/javascript" src="js/libs/pixi.js"></script>
        <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
        <script type="text/javascript" src="js/libs/pixi-picture.js"></script>
        <script type="text/javascript" src="js/libs/fpsmeter.js"></script>
        <script type="text/javascript" src="js/libs/lz-string.js"></script>
        <script type="text/javascript" src="js/libs/iphone-inline-video.browser.js"></script>
        <script type="text/javascript" src="js/rpg_core.js"></script>
        <script type="text/javascript" src="js/rpg_managers.js"></script>
        <script type="text/javascript" src="js/rpg_objects.js"></script>
        <script type="text/javascript" src="js/rpg_scenes.js"></script>
        <script type="text/javascript" src="js/rpg_sprites.js"></script>
        <script type="text/javascript" src="js/rpg_windows.js"></script>
        <script type="text/javascript" src="js/plugins.js"></script>

        <script type="text/javascript">
            // MANUEL DECRYPTION (ŞİFRE ÇÖZME) YAMASI
            (function() {
                var KEY = "cbf45b48176a036e58bd338a2b8f326d";

                function setupEncryption() {
                    if (typeof Decrypter !== 'undefined') {
                        Decrypter.hasEncryptedImages = true;
                        Decrypter.hasEncryptedAudio = true;
                        Decrypter._encryptionKey = KEY;
                        if (typeof Decrypter.SIGNATURE === 'undefined') {
                            Decrypter.SIGNATURE = "5250474d56000000";
                            Decrypter.VER = "000301";
                            Decrypter.REMAIN = "0000000000000000";
                        }
                    }
                }

                setupEncryption();

                // System.json yüklendikten sonra silinmesini engeller
                var _DataManager_setup = DataManager.setup;
                DataManager.setup = function(data) {
                    if (_DataManager_setup) _DataManager_setup.call(this, data);
                    setupEncryption();
                };
            })();

            // SES KİLİDİ AÇICI VE KONTROLLER
            function unlockAudioEngine() {
                if (typeof WebAudio !== 'undefined' && WebAudio._context) {
                    if (WebAudio._context.state === 'suspended') {
                        WebAudio._context.resume();
                    }
                }
            }

            function setKeyState(keyCode, keyName, isPressed) {
                unlockAudioEngine();

                var eventType = isPressed ? 'keydown' : 'keyup';
                var event = new KeyboardEvent(eventType, {
                    keyCode: keyCode,
                    which: keyCode,
                    key: keyName,
                    code: keyName,
                    bubbles: true,
                    cancelable: true
                });
                document.dispatchEvent(event);

                if (typeof Input !== 'undefined' && Input._currentState) {
                    var mapper = Input.keyMapper[keyCode];
                    if (mapper) {
                        Input._currentState[mapper] = isPressed;
                    }
                }
            }

            // Çoklu Dokunma (Multi-Touch) İşleyicisi
            var activeTouches = {};

            function processTouches(e) {
                e.preventDefault();
                unlockAudioEngine();
                var currentPressedKeys = {};

                for (var i = 0; i < e.touches.length; i++) {
                    var touch = e.touches[i];
                    var elem = document.elementFromPoint(touch.clientX, touch.clientY);
                    
                    if (elem && elem.classList.contains('v-btn') && elem.hasAttribute('data-key')) {
                        var keyCode = parseInt(elem.getAttribute('data-key'));
                        var keyName = elem.getAttribute('data-keyname');
                        currentPressedKeys[keyCode] = { name: keyName, element: elem };
                    }
                }

                for (var key in currentPressedKeys) {
                    if (!activeTouches[key]) {
                        activeTouches[key] = currentPressedKeys[key];
                        currentPressedKeys[key].element.classList.add('active');
                        setKeyState(parseInt(key), currentPressedKeys[key].name, true);
                    }
                }

                for (var key in activeTouches) {
                    if (!currentPressedKeys[key]) {
                        activeTouches[key].element.classList.remove('active');
                        setKeyState(parseInt(key), activeTouches[key].name, false);
                        delete activeTouches[key];
                    }
                }
            }

            var container = document.body;
            container.addEventListener('touchstart', processTouches, {passive: false});
            container.addEventListener('touchmove', processTouches, {passive: false});
            container.addEventListener('touchend', processTouches, {passive: false});
            container.addEventListener('touchcancel', processTouches, {passive: false});
            window.addEventListener('click', unlockAudioEngine, {once: true});
        </script>

        <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>
